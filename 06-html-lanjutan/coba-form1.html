<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coba Element From</title>
  </head>
  <body>
    <h1>Contoh elemen-elemem form pada HTML</h1>
    <from>
      <label for="nama">Nama:</label> 
      <input type="text" name="nama" id="nama" placeholder="Masukkan nama Anda" />
      <br><br>

      <label for="password">Password:</label> 
      <input type="password" name="password" id="password" placeholder="Masukkan password Anda" />
      <br><br>

      <label for="email">Email:</label> 
      <input type="email" name="email" id="email" placeholder="Masukkan email Anda" />
      <br><br>

      <label for="number">Angka:</label>
      <input type="number" name="number" id="number" placeholder="Masukkan angka Anda" min="0"max="100" />
      <br><br>

      <label for="tanggal">Tanggal:</label>
      <input type="date" name="tanggal" id="tanggal" placeholder="Masukkan tanggal Anda" />
      <br><br>

      <label for="warna">Warna:</label>
      <input type="color" name="warna" id="warna" placeholder="Masukkan warna Anda" />
      <br><br>

      <button type="submit">kirim</button>

    
  </body>
</html>
